services:
  front:
    build: ./front
    container_name: noe-front
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8001
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
    ports:
      - "3001:3000"

  backend:
    build: ./backend
    container_name: noe-backend
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_ALLOW_INSECURE_HTTP: "true"
      ALLOWED_HOSTS: backend
    ports:
      - "127.0.0.1:8001:8001"

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: noe-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      - "3000:6333"
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
