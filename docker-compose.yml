services:
  front:
    build: ./front
    container_name: noe-front
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8001
    ports:
      - "3001:3000"

  backend:
    build: ./backend
    container_name: noe-backend
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_ALLOW_INSECURE_HTTP: "true"
      ALLOWED_HOSTS: backend
      CHATBOT_API_FORMAT: openai
      CHATBOT_EMBEDDING_URL: https://generativelanguage.googleapis.com/v1beta/openai/embeddings
      CHATBOT_EMBEDDING_MODEL: ${CHATBOT_EMBEDDING_MODEL:-gemini-embedding-001}
      CHATBOT_EMBEDDING_API_KEY: ${GEMINI_API_KEY}
      CHATBOT_LLM_URL: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      CHATBOT_LLM_MODEL: ${CHATBOT_LLM_MODEL:-gemini-3.5-flash-lite}
      CHATBOT_LLM_API_KEY: ${GEMINI_API_KEY}
      CHATBOT_MAX_OUTPUT_TOKENS: "2000"
    ports:
      - "127.0.0.1:8001:8001"

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: noe-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      - "3000:6333"
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
